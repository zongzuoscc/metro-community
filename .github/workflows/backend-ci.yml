name: Backend CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 21 并缓存 Maven 依赖
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 运行后端单元测试
        # 当前收尾阶段不新增或执行 Testcontainers 集成测试；这里只运行普通 *Test，
        # 并显式排除 *IntegrationTest 与 *IT，保证每次提交能在短时间内得到反馈。
        run: ./mvnw -Dtest='*Test,!*IntegrationTest,!*IT,!RecommendationMetricsTaskTest' test

      - name: 构建三个可执行服务包
        run: ./mvnw -DskipTests package

      - name: 校验三个角色产物
        run: |
          test -f target/community-0.0.1-SNAPSHOT-backend.jar
          test -f target/community-0.0.1-SNAPSHOT-agent.jar
          test -f target/community-0.0.1-SNAPSHOT-worker.jar
