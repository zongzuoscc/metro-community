services:
  mysql:
    image: mysql:8.0
    container_name: metro-community-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metro_community}
      MYSQL_USER: ${DB_USERNAME:-metro}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - metro-community-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: metro-community-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - metro-community-redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: metro-community-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-metro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_HOST_PORT:-15673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - metro-community-rabbitmq-data:/var/lib/rabbitmq

  es:
    build: ./elasticsearch
    container_name: metro-community-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - metro-community-es-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-19200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-19300}:9300"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.4.1
    container_name: metro-community-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://es:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "${KIBANA_HOST_PORT:-15601}:5601"
    depends_on:
      - es

volumes:
  metro-community-mysql-data:
  metro-community-redis-data:
  metro-community-rabbitmq-data:
  metro-community-es-data:
