services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metro_community}
      MYSQL_USER: ${DB_USERNAME:-metro}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - metro-community-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - metro-community-redis-data:/data
    healthcheck:
      # Compose 使用 $$ 把变量留给容器内的 shell；双引号允许展开并保护密码中的特殊字符。
      # 旧写法套了单引号，Redis 实际收到字面量 ${REDIS_PASSWORD}，容器会永久 unhealthy。
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-metro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - metro-community-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  es:
    build: ./elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - metro-community-es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-19200}:9200"
      - "127.0.0.1:${ELASTICSEARCH_TRANSPORT_PORT:-19300}:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.1
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://es:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_HOST_PORT:-15601}:5601"
    depends_on:
      es:
        condition: service_healthy

  etcd:
    profiles: ["ai"]
    image: quay.io/coreos/etcd:v3.5.25@sha256:52f17f7e56e4f7239f0320dbfcbcc24721163d7d78ae710b466af3254ccf6366
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - metro-community-milvus-etcd-data:/etcd
    networks:
      - metro-milvus-internal-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles: ["ai"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:?set MILVUS_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:?set MILVUS_MINIO_ROOT_PASSWORD in .env}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - metro-community-milvus-minio-data:/minio_data
    networks:
      - metro-milvus-internal-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["ai"]
    image: milvusdb/milvus:v2.6.20@sha256:e5420c36bac36a605c1ea6e04114f5d7923f114e87bbb774bd0669b9f3e41d27
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ROOT_USER:?set MILVUS_MINIO_ROOT_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_ROOT_PASSWORD:?set MILVUS_MINIO_ROOT_PASSWORD in .env}
      MQ_TYPE: woodpecker
    volumes:
      - metro-community-milvus-data:/var/lib/milvus
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-29530}:19530"
    networks:
      - metro-ai-app-net
      - metro-milvus-internal-net
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.32.2@sha256:c3886c198155aa7d45a29851100cc16f5d6ea6777d635ddd0597fe95874161af
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - metro-community-ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-21434}:11434"
    networks:
      - metro-ai-app-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

networks:
  metro-ai-app-net:
  metro-milvus-internal-net:
    internal: true

volumes:
  metro-community-mysql-data:
  metro-community-redis-data:
  metro-community-rabbitmq-data:
  metro-community-es-data:
  metro-community-milvus-etcd-data:
  metro-community-milvus-minio-data:
  metro-community-milvus-data:
  metro-community-ollama-data:
