server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: community

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # 单个文件最大大小 (按需调整，例如 10MB, 50MB)
      max-request-size: 50MB   # 整个请求最大大小 (通常比单个文件大，用于多文件上传)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/metro_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:metro}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:metro}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
          max-attempts: 3

  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    debug: false
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}
  ai:
    model:
      chat: none
      embedding: none
    retry:
      max-attempts: 1
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:19200}

# MyBatis-Plus ??
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted # ???????
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:/mapper/*.xml

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${JWT_TOKEN_TTL:P7D}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    ticket-ttl: ${WEBSOCKET_TICKET_TTL:PT30S}

metro:
  migration:
    stage-b:
      action: ${METRO_STAGE_B_MIGRATION_ACTION:NONE}
      operator-identity: ${METRO_STAGE_B_OPERATOR_IDENTITY:}
      verification-report-path: ${METRO_STAGE_B_VERIFICATION_REPORT_PATH:}
      batch-size: ${METRO_STAGE_B_MIGRATION_BATCH_SIZE:100}
      verification-page-size: ${METRO_STAGE_B_VERIFICATION_PAGE_SIZE:500}
      maximum-reported-mismatches: ${METRO_STAGE_B_MAX_MISMATCHES:100}
      elasticsearch-read-alias: ${METRO_STAGE_B_ES_READ_ALIAS:article-read}
      elasticsearch-pit-keep-alive: ${METRO_STAGE_B_ES_PIT_KEEP_ALIVE:PT1M}
  article:
    revision-mode: ${METRO_ARTICLE_REVISION_MODE:LEGACY}
    rollout-build:
      binary-generation: ${METRO_ARTICLE_ROLLOUT_BINARY_GENERATION:-1}
      schema-generation: ${METRO_ARTICLE_ROLLOUT_SCHEMA_GENERATION:-1}
      digest: ${METRO_ARTICLE_ROLLOUT_BUILD_DIGEST:}
    rollout-operator:
      action: ${METRO_STAGE_B_ROLLOUT_ACTION:NONE}
      target: ${METRO_STAGE_B_ROLLOUT_TARGET:}
      sentinel-run-path: ${METRO_STAGE_B_ROLLOUT_SENTINEL_RUN_PATH:}
      sentinel-report-path: ${METRO_STAGE_B_ROLLOUT_SENTINEL_REPORT_PATH:}
      target-binary-generation: ${METRO_STAGE_B_ROLLOUT_TARGET_BINARY_GENERATION:-1}
      target-schema-generation: ${METRO_STAGE_B_ROLLOUT_TARGET_SCHEMA_GENERATION:-1}
      target-build-digest: ${METRO_STAGE_B_ROLLOUT_TARGET_BUILD_DIGEST:}
    projection:
      lease-duration: ${METRO_ARTICLE_PROJECTION_LEASE_DURATION:PT30S}
      index-name: ${METRO_ARTICLE_PROJECTION_INDEX:article}
      reconcile-enabled: ${METRO_ARTICLE_PROJECTION_RECONCILE_ENABLED:false}
      reconcile-start-after-id: ${METRO_ARTICLE_PROJECTION_RECONCILE_START_AFTER_ID:0}
      reconcile-batch-size: ${METRO_ARTICLE_PROJECTION_RECONCILE_BATCH_SIZE:100}
      reconcile-maximum-batches: ${METRO_ARTICLE_PROJECTION_RECONCILE_MAXIMUM_BATCHES:10000}
      retry:
        initial-interval: ${METRO_ARTICLE_PROJECTION_RETRY_INITIAL_INTERVAL:PT10S}
        max-interval: ${METRO_ARTICLE_PROJECTION_RETRY_MAX_INTERVAL:PT30S}
        multiplier: ${METRO_ARTICLE_PROJECTION_RETRY_MULTIPLIER:2.0}
        max-attempts: ${METRO_ARTICLE_PROJECTION_RETRY_MAX_ATTEMPTS:5}
  projection:
    article-chunks:
      enabled: ${METRO_ARTICLE_CHUNKS_ENABLED:false}
      parser-generation: ${METRO_ARTICLE_CHUNK_PARSER_GENERATION:1}
    article-chunk-elasticsearch:
      enabled: ${METRO_ARTICLE_CHUNK_ELASTICSEARCH_ENABLED:false}
      index-name: ${METRO_ARTICLE_CHUNK_ELASTICSEARCH_INDEX:article-chunks-v1}
      lease-duration: ${METRO_ARTICLE_CHUNK_ELASTICSEARCH_LEASE_DURATION:PT30S}
    article-chunk-milvus:
      enabled: ${METRO_ARTICLE_CHUNK_MILVUS_ENABLED:false}
      uri: ${METRO_ARTICLE_CHUNK_MILVUS_URI:http://127.0.0.1:29530}
      username: ${METRO_ARTICLE_CHUNK_MILVUS_USERNAME:}
      password: ${METRO_ARTICLE_CHUNK_MILVUS_PASSWORD:}
      physical-collection: ${METRO_ARTICLE_CHUNK_MILVUS_COLLECTION:metro_article_chunks_bgem3_v1}
      lease-duration: ${METRO_ARTICLE_CHUNK_MILVUS_LEASE_DURATION:PT60S}
      connect-timeout: ${METRO_ARTICLE_CHUNK_MILVUS_CONNECT_TIMEOUT:PT10S}
      rpc-timeout: ${METRO_ARTICLE_CHUNK_MILVUS_RPC_TIMEOUT:PT60S}
  events:
    outbox:
      dispatch-enabled: ${METRO_DOMAIN_EVENT_DISPATCH_ENABLED:true}
      dispatch-delay-ms: ${METRO_DOMAIN_EVENT_DISPATCH_DELAY_MS:1000}
      batch-size: 100
      lease-duration: PT30S
      max-attempts: 12
    retention:
      # Destructive retention is opt-in; read-only backlog metrics remain enabled by default.
      scheduling-enabled: ${METRO_DOMAIN_EVENT_RETENTION_SCHEDULING_ENABLED:false}
      cron: "${METRO_DOMAIN_EVENT_RETENTION_CRON:0 30 4 * * *}"
      batch-size: ${METRO_DOMAIN_EVENT_RETENTION_BATCH_SIZE:200}
      max-batches: ${METRO_DOMAIN_EVENT_RETENTION_MAX_BATCHES:20}
      metrics-enabled: ${METRO_DOMAIN_EVENT_RETENTION_METRICS_ENABLED:true}
      metrics-delay: ${METRO_DOMAIN_EVENT_RETENTION_METRICS_DELAY:PT5M}
      metrics-initial-delay: ${METRO_DOMAIN_EVENT_RETENTION_METRICS_INITIAL_DELAY:PT30S}
  ai:
    enabled: ${METRO_AI_ENABLED:false}
    agent:
      enabled: ${METRO_AI_AGENT_ENABLED:false}
      turn-recovery-enabled: ${METRO_AI_AGENT_TURN_RECOVERY_ENABLED:false}
      turn-recovery-delay-ms: ${METRO_AI_AGENT_TURN_RECOVERY_DELAY_MS:10000}
      max-input-characters: 4000
      per-minute: 8
      per-day: 100
      quota-window: PT1M
      timeout: PT45S
      bulkhead: 8
    article-summary:
      max-input-characters: 100000
      per-minute: 5
      per-day: 30
      quota-window: PT1M
      timeout: PT60S
      bulkhead: 4
    writing:
      enabled: ${METRO_AI_WRITING_ENABLED:false}
      max-input-characters: 20000
      per-minute: 10
      per-day: 60
      quota-window: PT10M
      timeout: PT60S
      bulkhead: 4
    hyde:
      max-output-characters: 600
      timeout: PT8S
      bulkhead: 8
    moderation:
      enabled: ${METRO_AI_MODERATION_ENABLED:false}
      timeout: PT20S
      task-timeout: PT90S
      bulkhead: 2
      max-output-tokens: 800
      max-chunk-tokens: 3000
      overlap-tokens: 200
      max-chunks: 16
      max-estimated-tokens: 48000
      # Budget coefficients are conservative configured ceilings, not live price discovery.
      max-estimated-cost-micros: ${METRO_AI_MODERATION_MAX_COST_MICROS:100000}
      input-cost-micros-per-million-tokens: ${METRO_AI_MODERATION_INPUT_COST_MICROS_PER_MILLION:500000}
      output-cost-micros-per-million-tokens: ${METRO_AI_MODERATION_OUTPUT_COST_MICROS_PER_MILLION:2000000}
      minimum-confidence: 0.80
      lease-duration: PT120S
      recovery-enabled: ${METRO_AI_MODERATION_RECOVERY_ENABLED:true}
      recovery-delay-ms: ${METRO_AI_MODERATION_RECOVERY_DELAY_MS:30000}
      recovery-initial-delay-ms: ${METRO_AI_MODERATION_RECOVERY_INITIAL_DELAY_MS:30000}
    memory:
      enabled: ${METRO_AI_MEMORY_ENABLED:false}
      timeout: PT20S
      bulkhead: 2
    embedding:
      enabled: ${METRO_AI_EMBEDDING_ENABLED:false}
      timeout: PT45S
      bulkhead: 4
    runtime:
      quota-namespace: metro:ai:quota
      retry-delay: PT0.1S
      interactive-max-attempts: 2
      background-max-attempts: 3
      circuit-sliding-window-size: 20
      circuit-minimum-calls: 10
      circuit-failure-rate-threshold: 50
      circuit-open-state-wait-duration: PT30S
      circuit-permitted-calls-in-half-open: 2
      shutdown-timeout: PT5S
      provider-connect-timeout: PT2S
      provider-timeout-margin: PT1S
    deep-seek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: "${OLLAMA_EMBEDDING_MODEL:metro-bge-m3:790764642607}"

recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  session-ttl-minutes: ${RECOMMENDATION_SESSION_TTL_MINUTES:10}
  profile-ttl-days: ${RECOMMENDATION_PROFILE_TTL_DAYS:35}
  profile-window-days: ${RECOMMENDATION_PROFILE_WINDOW_DAYS:30}
  profile-fact-limit: ${RECOMMENDATION_PROFILE_FACT_LIMIT:10000}
  profile-tag-association-limit: ${RECOMMENDATION_PROFILE_TAG_ASSOCIATION_LIMIT:50000}
  profile-max-tags: ${RECOMMENDATION_PROFILE_MAX_TAGS:100}
  profile-max-authors: ${RECOMMENDATION_PROFILE_MAX_AUTHORS:100}
  profile-repair-enabled: ${RECOMMENDATION_PROFILE_REPAIR_ENABLED:true}
  profile-repair-batch-size: ${RECOMMENDATION_PROFILE_REPAIR_BATCH_SIZE:100}
  profile-repair-delay-ms: ${RECOMMENDATION_PROFILE_REPAIR_DELAY_MS:30000}
  profile-repair-initial-delay-ms: ${RECOMMENDATION_PROFILE_REPAIR_INITIAL_DELAY_MS:30000}
  default-page-size: ${RECOMMENDATION_DEFAULT_PAGE_SIZE:10}
  max-page-size: ${RECOMMENDATION_MAX_PAGE_SIZE:20}
  feed-request-limit: ${RECOMMENDATION_FEED_REQUEST_LIMIT:20}
  feed-rate-window-seconds: ${RECOMMENDATION_FEED_RATE_WINDOW_SECONDS:60}
  minimum-user-events: ${RECOMMENDATION_MINIMUM_USER_EVENTS:20}
  minimum-global-events: ${RECOMMENDATION_MINIMUM_GLOBAL_EVENTS:500}
  model-window-days: ${RECOMMENDATION_MODEL_WINDOW_DAYS:90}
  label-window-days: ${RECOMMENDATION_LABEL_WINDOW_DAYS:7}
  model-max-age-days: ${RECOMMENDATION_MODEL_MAX_AGE_DAYS:7}
  training-sample-limit: ${RECOMMENDATION_TRAINING_SAMPLE_LIMIT:50000}
  training-max-samples-per-user: ${RECOMMENDATION_TRAINING_MAX_SAMPLES_PER_USER:500}
  training-exposure-scan-limit: ${RECOMMENDATION_TRAINING_EXPOSURE_SCAN_LIMIT:200000}
  training-fact-scan-limit: ${RECOMMENDATION_TRAINING_FACT_SCAN_LIMIT:200000}
  model-directory: ${RECOMMENDATION_MODEL_DIRECTORY:data/recommendation-models}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    elasticsearch:
      enabled: false
    mail:
      enabled: false

resilience4j:
  bulkhead:
    metrics:
      enabled: false
      legacy:
        enabled: false
  circuitbreaker:
    metrics:
      enabled: false
      legacy:
        enabled: false
  retry:
    metrics:
      enabled: false
      legacy:
        enabled: false
  thread-pool-bulkhead:
    metrics:
      enabled: false
  timelimiter:
    metrics:
      enabled: false
      legacy:
        enabled: false
