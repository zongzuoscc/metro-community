server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: community

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # 单个文件最大大小 (按需调整，例如 10MB, 50MB)
      max-request-size: 50MB   # 整个请求最大大小 (通常比单个文件大，用于多文件上传)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/metro_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:metro}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:metro}
    password: ${RABBITMQ_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.163.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    debug: false
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        enabled: ${AI_CHAT_ENABLED:false}
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:19200}

# MyBatis-Plus ??
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted # ???????
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:/mapper/*.xml

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
