server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/metro_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: metro
    password: replace-with-a-local-password
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: replace-with-a-local-password
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: metro
    password: replace-with-a-local-password
  ai:
    model:
      chat: none
      embedding: none
    retry:
      max-attempts: 1

app:
  security:
    jwt-secret: replace-with-a-random-32-byte-minimum-secret
    cors-allowed-origins:
      - http://localhost:5173
  websocket:
    ticket-ttl: PT30S

metro:
  migration:
    stage-b:
      action: ${METRO_STAGE_B_MIGRATION_ACTION:NONE}
      operator-identity: ${METRO_STAGE_B_OPERATOR_IDENTITY:}
      verification-report-path: ${METRO_STAGE_B_VERIFICATION_REPORT_PATH:}
      batch-size: ${METRO_STAGE_B_MIGRATION_BATCH_SIZE:100}
      verification-page-size: ${METRO_STAGE_B_VERIFICATION_PAGE_SIZE:500}
      maximum-reported-mismatches: ${METRO_STAGE_B_MAX_MISMATCHES:100}
      elasticsearch-read-alias: ${METRO_STAGE_B_ES_READ_ALIAS:article-read}
      elasticsearch-pit-keep-alive: ${METRO_STAGE_B_ES_PIT_KEEP_ALIVE:PT1M}
  article:
    revision-mode: ${METRO_ARTICLE_REVISION_MODE:LEGACY}
    rollout-build:
      binary-generation: ${METRO_ARTICLE_ROLLOUT_BINARY_GENERATION:-1}
      schema-generation: ${METRO_ARTICLE_ROLLOUT_SCHEMA_GENERATION:-1}
      digest: ${METRO_ARTICLE_ROLLOUT_BUILD_DIGEST:}
    rollout-operator:
      action: ${METRO_STAGE_B_ROLLOUT_ACTION:NONE}
      target: ${METRO_STAGE_B_ROLLOUT_TARGET:}
      sentinel-run-path: ${METRO_STAGE_B_ROLLOUT_SENTINEL_RUN_PATH:}
      sentinel-report-path: ${METRO_STAGE_B_ROLLOUT_SENTINEL_REPORT_PATH:}
      target-binary-generation: ${METRO_STAGE_B_ROLLOUT_TARGET_BINARY_GENERATION:-1}
      target-schema-generation: ${METRO_STAGE_B_ROLLOUT_TARGET_SCHEMA_GENERATION:-1}
      target-build-digest: ${METRO_STAGE_B_ROLLOUT_TARGET_BUILD_DIGEST:}
    projection:
      lease-duration: ${METRO_ARTICLE_PROJECTION_LEASE_DURATION:PT30S}
      index-name: ${METRO_ARTICLE_PROJECTION_INDEX:article}
      reconcile-enabled: ${METRO_ARTICLE_PROJECTION_RECONCILE_ENABLED:false}
      reconcile-start-after-id: ${METRO_ARTICLE_PROJECTION_RECONCILE_START_AFTER_ID:0}
      reconcile-batch-size: ${METRO_ARTICLE_PROJECTION_RECONCILE_BATCH_SIZE:100}
      reconcile-maximum-batches: ${METRO_ARTICLE_PROJECTION_RECONCILE_MAXIMUM_BATCHES:10000}
      retry:
        initial-interval: ${METRO_ARTICLE_PROJECTION_RETRY_INITIAL_INTERVAL:PT10S}
        max-interval: ${METRO_ARTICLE_PROJECTION_RETRY_MAX_INTERVAL:PT30S}
        multiplier: ${METRO_ARTICLE_PROJECTION_RETRY_MULTIPLIER:2.0}
        max-attempts: ${METRO_ARTICLE_PROJECTION_RETRY_MAX_ATTEMPTS:5}
  projection:
    article-chunks:
      enabled: ${METRO_ARTICLE_CHUNKS_ENABLED:false}
      parser-generation: ${METRO_ARTICLE_CHUNK_PARSER_GENERATION:1}
    article-chunk-elasticsearch:
      enabled: ${METRO_ARTICLE_CHUNK_ELASTICSEARCH_ENABLED:false}
      index-name: ${METRO_ARTICLE_CHUNK_ELASTICSEARCH_INDEX:article-chunks-v1}
      lease-duration: ${METRO_ARTICLE_CHUNK_ELASTICSEARCH_LEASE_DURATION:PT30S}
  events:
    retention:
      scheduling-enabled: ${METRO_DOMAIN_EVENT_RETENTION_SCHEDULING_ENABLED:false}
      cron: "${METRO_DOMAIN_EVENT_RETENTION_CRON:0 30 4 * * *}"
      batch-size: ${METRO_DOMAIN_EVENT_RETENTION_BATCH_SIZE:200}
      max-batches: ${METRO_DOMAIN_EVENT_RETENTION_MAX_BATCHES:20}
      metrics-enabled: ${METRO_DOMAIN_EVENT_RETENTION_METRICS_ENABLED:true}
      metrics-delay: ${METRO_DOMAIN_EVENT_RETENTION_METRICS_DELAY:PT5M}
      metrics-initial-delay: ${METRO_DOMAIN_EVENT_RETENTION_METRICS_INITIAL_DELAY:PT30S}
  ai:
    enabled: ${METRO_AI_ENABLED:false}
    agent:
      enabled: ${METRO_AI_AGENT_ENABLED:false}
    memory:
      enabled: ${METRO_AI_MEMORY_ENABLED:false}
    writing:
      enabled: ${METRO_AI_WRITING_ENABLED:false}
    moderation:
      enabled: ${METRO_AI_MODERATION_ENABLED:false}
      timeout: PT20S
      task-timeout: PT90S
      max-output-tokens: 800
      max-chunk-tokens: 3000
      overlap-tokens: 200
      max-chunks: 16
      max-estimated-tokens: 48000
      max-estimated-cost-micros: ${METRO_AI_MODERATION_MAX_COST_MICROS:100000}
      input-cost-micros-per-million-tokens: ${METRO_AI_MODERATION_INPUT_COST_MICROS_PER_MILLION:500000}
      output-cost-micros-per-million-tokens: ${METRO_AI_MODERATION_OUTPUT_COST_MICROS_PER_MILLION:2000000}
      minimum-confidence: 0.80
      lease-duration: PT120S
      recovery-enabled: ${METRO_AI_MODERATION_RECOVERY_ENABLED:true}
      recovery-delay-ms: ${METRO_AI_MODERATION_RECOVERY_DELAY_MS:30000}
      recovery-initial-delay-ms: ${METRO_AI_MODERATION_RECOVERY_INITIAL_DELAY_MS:30000}
    embedding:
      enabled: ${METRO_AI_EMBEDDING_ENABLED:false}
    deep-seek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: "${OLLAMA_EMBEDDING_MODEL:metro-bge-m3:790764642607}"

recommendation:
  training-exposure-scan-limit: 200000
  training-fact-scan-limit: 200000
